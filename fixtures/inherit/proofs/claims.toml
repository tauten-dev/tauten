# The publish protocol is tauten's; its claim is inherited, checked against
# the locked version and tauten's shipped crates/tauten/claims.json.
version = 2

[gate]
command = ["false"]

[[claim]]
crate = "consumer"
file = "consumer/src/lib.rs"
function = "step"
lean = "tauten.publish.step"
theorems = []
mutants = []
inherit = "tauten@0.1.0:step"

# A shared kernel helper (A10, #14), inherited from the claims.json that
# tauten-check-kernel ships.
[[claim]]
crate = "consumer"
file = "consumer/src/lib.rs"
function = "charge"
lean = "tauten_check_kernel.budget.charge"
theorems = []
mutants = []
inherit = "tauten-check-kernel@0.1.0:charge"
