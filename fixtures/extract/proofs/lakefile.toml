# Lean 4 project over the Charon/Aeneas translation of the crates listed in
# proofs/claims.toml ([gate] crates). Generated by `cargo tauten init
# --proofs`; pins as in tauten's own proofs: Lean v4.35.0, Aeneas
# nightly-2026.11.07-c5eb4a2 at /opt/aeneas inside the proofs image,
# mathlib as in lake-manifest.json. Keep the package name: the image's
# prebuilt dependencies are keyed to this manifest.
name = "tauten-proofs"
defaultTargets = ["Extracted", "Proofs", "Audit"]

[[require]]
name = "aeneas"
path = "/opt/aeneas/backends/lean"

# Generated by proofs/extract.sh and committed; the gate refuses drift.
[[lean_lib]]
name = "Extracted"
globs = ["Extracted.+"]

# Your theorems, stated over the extracted functions. Proofs.lean imports
# every file under Proofs/.
[[lean_lib]]
name = "Proofs"

# Axiom audit and the total no-failure check (read by proofs/gate.py).
[[lean_lib]]
name = "Audit"
roots = ["Audit"]
