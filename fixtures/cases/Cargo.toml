[workspace]
resolver = "3"
members = ["rej-conditional-no-std", "acc-kernel-not-test", "rej-cfg-attr-allow", "rej-group-allow", "rej-test-exception", "rej-panic", "rej-panic-in-result", "rej-exit", "rej-float-eq", "rej-let-underscore", "rej-undocumented-unsafe", "rej-await-lock", "rej-kernel-std", "rej-kernel-dep", "acc-effects", "rej-effects", "rej-file-allow", "rej-authority-alias", "rej-test-hygiene", "rej-dependent", "acc-core", "acc-edge", "acc-kernel", "rej-allow", "rej-ambient-clock", "rej-contract-overflow", "rej-crate-wide", "rej-detached-thread", "rej-forged-capability", "rej-global-state", "rej-hidden-authority", "rej-ignored-result", "rej-index", "rej-infinite-loop", "rej-kernel-exception", "rej-kernel-impure", "rej-kernel-up", "rej-lossy-cast", "rej-no-tier", "rej-placeholder", "rej-print", "rej-stub", "rej-stub-excused", "rej-unit-error", "rej-unsafe", "rej-unwrap", "rej-wildcard"]

# TAU-H001 accept case: release builds check integer overflow.
[profile.release]
overflow-checks = true
