# Fixture of the proof tier (P5): a kernel crate whose proved functions'
# arithmetic and indexing findings are subsumed by their proofs
# (proofs/claims.json, generated by a real gate run), next to functions whose
# findings stay errors. Tested by crates/cargo-tauten/tests/proofs.rs.
[workspace]
resolver = "3"
members = ["sub-kernel"]

[workspace.package]
version = "0.0.0"
edition = "2024"
publish = false
