# The proof gate in the pinned toolchain image (generated by `cargo tauten
# init --proofs`). Run through `sh proofs/run.sh` or `cargo tauten proofs`.
# Image: Lean v4.35.0, Aeneas nightly-2026.11.07-c5eb4a2, Charon 8cae8fd on
# nightly-2026-09-17, mathlib per proofs/lake-manifest.json; linux/amd64;
# about 20 GB unpacked.
services:
  proofs:
    image: ${PROOFS_IMAGE:-ghcr.io/tauten-dev/proofs-toolchain:lean-4.35.0-aeneas-c5eb4a2-charon-8cae8fd}
    platform: linux/amd64
    pull_policy: never
    init: true
    # Network stays on: in a fresh container Charon builds its full-MIR
    # sysroot (`miri setup`), which fetches crates from crates.io.
    volumes:
      - type: bind
        source: ..
        target: /repo
        read_only: true
    working_dir: /work
    command: ["sh", "/repo/proofs/container.sh"]
