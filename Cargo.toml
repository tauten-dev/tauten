[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["fixtures", "proofs"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/tauten-dev/tauten"
homepage = "https://tauten.dev"

[workspace.dependencies]
tauten-check = { path = "crates/tauten-check", version = "0.0.1" }
