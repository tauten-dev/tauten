[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["fixtures", "proofs"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/tauten-dev/tauten"
homepage = "https://tauten.dev"

[workspace.dependencies]
tauten-check-kernel = { path = "crates/tauten-check-kernel", version = "0.1.0" }
tauten-check = { path = "crates/tauten-check", version = "0.1.0" }

# TAU-H001: release builds check integer overflow.
[profile.release]
overflow-checks = true

# Committed files regenerated and compared byte for byte by
# `cargo tauten generated` (A11). The CI gate runs `rules`; `translation`
# needs Docker and the proofs image.
[[workspace.metadata.tauten.generated]]
name = "rules"
command = ["cargo", "run", "--locked", "--quiet", "-p", "cargo-tauten", "--", "tauten", "explain", "--markdown"]
stdout = "docs/RULES.md"

[[workspace.metadata.tauten.generated]]
name = "shipped-claims"
command = ["cargo", "run", "--locked", "--quiet", "-p", "cargo-tauten", "--", "tauten", "proofs", "export", "--crate", "tauten"]
stdout = "crates/tauten/claims.json"

[[workspace.metadata.tauten.generated]]
name = "translation"
command = ["sh", "proofs/refresh.sh"]
outputs = ["proofs/Extracted"]
