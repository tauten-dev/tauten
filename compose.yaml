name: tauten

# Everything that gates a commit runs here, from a read-only checkout, with
# build output and registry caches in named volumes.
#   docker compose build tools
#   docker compose run --rm gate        # fmt, build, tests, self-check, deny
#   docker compose run --rm mutants     # mutation testing of the pure crate
#   docker compose run --rm dev         # shell with a writable checkout

x-tools: &tools
  image: tauten-tools:local
  pull_policy: never
  init: true
  cpus: ${TAUTEN_CPUS:-8}
  mem_limit: ${TAUTEN_MEMORY:-8g}
  pids_limit: 1024
  environment:
    CARGO_BUILD_JOBS: ${TAUTEN_JOBS:-8}
  volumes:
    - type: bind
      source: .
      target: /work/tauten
      read_only: true
    - cargo-target:/cache/target
    - cargo-registry:/usr/local/cargo/registry
    - cargo-git:/usr/local/cargo/git

services:
  tools:
    build:
      context: docker
      dockerfile: Dockerfile
    image: tauten-tools:local
    profiles: [build]

  gate:
    <<: *tools
    command: ["scripts/gate"]

  mutants:
    <<: *tools
    command: ["scripts/mutants"]

  dev:
    <<: *tools
    profiles: [dev]
    volumes:
      - type: bind
        source: .
        target: /work/tauten
      - cargo-target:/cache/target
      - cargo-registry:/usr/local/cargo/registry
      - cargo-git:/usr/local/cargo/git
    command: ["bash"]

volumes:
  cargo-target:
  cargo-registry:
  cargo-git:
