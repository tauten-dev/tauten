[package]
name = "tauten-probe"
description = "P0 probe (docs/proofs/probe.md): what Charon/Aeneas accept from tauten-shaped code. Never published."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

# Excluded from the tauten workspace (root Cargo.toml `exclude`); it inherits
# the workspace's package fields only inside the shadow workspace that
# proofs/extract.sh builds, which is the question P0 asks (plan section 6, Q4).
[dependencies]
tauten = { path = "../../crates/tauten" }

[lints.rust]
unsafe_code = "forbid"

# Read by Charon (proofs/extract.sh) for the combined probe translation that
# proofs/Probe/ proves over. `include` makes the tauten runtime helpers the
# macros call (`contract::holds`, `contract::snapshot`) and its error types
# transparent; without it they are opaque external declarations, which
# Aeneas emits as Lean axioms (docs/proofs/probe.md).
[package.metadata.charon]
start_from = [
    "tauten_probe::tier::rank",
    "tauten_probe::tier::may_depend_on",
    "tauten_probe::tier::may_depend_on_derived",
    "tauten_probe::ratchet",
    "tauten_probe::percent",
    "tauten_probe::percent_hand",
    "tauten_probe::contract",
    "tauten_probe::contract_hand",
    "tauten_probe::ledger",
    "tauten_probe::control",
]
include = ["tauten::contract", "tauten::error"]
