# tauten's own proof claims (P5 format; docs/proofs/README.md). One entry
# per proved function: the theorems over its Charon/Aeneas translation and
# the mutants (defined in proofs/mutants.py) that break them.
# `cargo tauten proofs` runs the gate below and records the outcomes in
# proofs/claims.json, which is the website's badge data. Claims of
# tauten-proof-instances are about the macros' expansion for these
# instances only: label them "Proved for listed instances".
version = 2

[gate]
command = ["sh", "proofs/run.sh"]
extract = ["sh", "proofs/run.sh", "sh", "/repo/proofs/container.sh", "sh", "proofs/gate.sh", "--extract-only"]
try = ["sh", "proofs/run.sh", "sh", "/repo/proofs/container.sh", "sh", "proofs/gate.sh", "--only-mutants"]
crates = ["crates/tauten-check-kernel", "crates/tauten-proof-instances"]

[[claim]]
crate = "tauten-check-kernel"
file = "crates/tauten-check-kernel/src/tiers.rs"
function = "rank"
lean = "tauten_check_kernel.tiers.rank"
theorems = ["Tauten.Kernel.rank_spec"]
mutants = ["core-edge-swapped", "kernel-ranks-as-core"]

