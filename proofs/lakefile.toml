# Lean 4 project over the Charon/Aeneas translation of tauten code
# (docs/PROOF-PLAN.md; P0 probe results in docs/proofs/probe.md). Pins are
# writfold's, unchanged: Lean v4.35.0, Aeneas nightly-2026.11.07-c5eb4a2 at
# /opt/aeneas inside the proofs image, mathlib as in lake-manifest.json.
name = "tauten-proofs"
defaultTargets = ["Extracted", "Probe", "Audit"]

[[require]]
name = "aeneas"
path = "/opt/aeneas/backends/lean"

# Generated by proofs/extract.sh from proofs/probe and committed.
[[lean_lib]]
name = "Extracted"
globs = ["Extracted.+"]

# P0 probe theorems over the extracted functions.
[[lean_lib]]
name = "Probe"

# Every theorem's axioms, checked against Lean's standard three.
[[lean_lib]]
name = "Audit"
roots = ["Audit"]
