# Lean 4 project over the Charon/Aeneas translation of
# crates/tauten-check-kernel (docs/PROOF-PLAN.md, docs/proofs/README.md).
# Pins are writfold's, unchanged: Lean v4.35.0, Aeneas
# nightly-2026.11.07-c5eb4a2 at /opt/aeneas inside the proofs image, mathlib
# as in lake-manifest.json.
name = "tauten-proofs"
defaultTargets = ["Extracted", "Tauten", "Audit"]

[[require]]
name = "aeneas"
path = "/opt/aeneas/backends/lean"

# Generated by proofs/extract.sh from crates/tauten-check-kernel and
# committed; the gate refuses drift.
[[lean_lib]]
name = "Extracted"
globs = ["Extracted.+"]

# The theorems, stated over the extracted functions.
[[lean_lib]]
name = "Tauten"

# Every theorem's axioms, checked against Lean's standard three; required
# claims; every extracted function covered by a claim.
[[lean_lib]]
name = "Audit"
roots = ["Audit"]
