name: ghcr-check
# Temporary: confirms Actions can read the proofs toolchain image. Removed after use.
on: workflow_dispatch
permissions:
  contents: read
  packages: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Log in to ghcr with the job token
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Read the image manifest
        run: docker manifest inspect ghcr.io/tauten-dev/proofs-toolchain:lean-4.35.0-aeneas-c5eb4a2-charon-8cae8fd | head -20
      - name: Disk space available for the 20 GB image
        run: df -h /
