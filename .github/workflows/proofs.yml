name: proofs

# Lean proofs over crates/tauten-check-kernel and over the macros' expansion
# of crates/tauten-proof-instances (docs/proofs/README.md): extract with
# Charon/Aeneas, refuse drift against proofs/Extracted/, lake build with the
# axiom, constructor and coverage audit, mutant calibration (kernel and
# macro-source mutants). Separate from the `gate` workflow; runs only when
# the proved code, the macros, the tauten runtime they call or the proofs
# change, nightly, on demand, and from `release.yml` on the exact tag commit,
# where publishing waits for it (#53). Always the full gate: every stage and
# every mutant, never the ship level.
on:
  push:
    branches: [main]
    paths:
      - "crates/tauten-check-kernel/**"
      - "crates/tauten-macros/**"
      - "crates/tauten/**"
      - "crates/tauten-proof-instances/**"
      - "proofs/**"
      - "compose.proofs.yaml"
      - ".github/workflows/proofs.yml"
  pull_request:
    paths:
      - "crates/tauten-check-kernel/**"
      - "crates/tauten-macros/**"
      - "crates/tauten/**"
      - "crates/tauten-proof-instances/**"
      - "proofs/**"
      - "compose.proofs.yaml"
      - ".github/workflows/proofs.yml"
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  packages: read

# Called from release.yml, github.workflow is `release` and github.ref the
# tag (or the rehearsed branch), so a release run never shares a group with,
# or is cancelled by, the proofs runs on pushes to main.
concurrency:
  group: ${{ github.workflow }}-proofs-${{ github.ref }}
  cancel-in-progress: true

env:
  PROOFS_IMAGE: ghcr.io/tauten-dev/proofs-toolchain:lean-4.35.0-aeneas-c5eb4a2-charon-8cae8fd

jobs:
  proofs:
    runs-on: ubuntu-24.04
    # A full run takes about an hour on a hosted runner; 60 minutes cancelled
    # runs that would have passed. A timeout is still a failure, never a pass.
    timeout-minutes: 150
    steps:
      - name: Free disk space for the proofs image (about 20 GB unpacked)
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift \
            /usr/local/lib/node_modules /usr/local/share/powershell /usr/local/share/chromium
          sudo docker image prune --all --force
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pull the pinned proofs toolchain image
        run: |
          docker login ghcr.io -u "${{ github.actor }}" --password-stdin <<< "${{ secrets.GITHUB_TOKEN }}"
          time docker pull "$PROOFS_IMAGE"
          docker logout ghcr.io
          df -h /
      - name: Proofs gate (extract, drift, lake build, axiom audit, mutants)
        run: |
          export TAUTEN_PROOFS_CPUS="$(nproc)"
          time docker compose -f compose.proofs.yaml run --rm proofs
