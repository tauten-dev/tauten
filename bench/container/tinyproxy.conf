# Egress proxy for agent containers. Agent containers sit on an internal
# Docker network with no route out; this proxy is the only exit and allows
# only the domains in /etc/tinyproxy/allowlist (anchored regexes).
Port 8888
Listen 0.0.0.0
Timeout 600
MaxClients 64
LogLevel Connect
Allow 0.0.0.0/0
FilterDefaultDeny Yes
FilterType ere
FilterURLs Off
Filter "/etc/tinyproxy/allowlist"
ConnectPort 443
