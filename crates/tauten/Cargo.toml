[package]
name = "tauten"
description = "The tauten discipline for Rust: explicit capabilities, effects in signatures, checked evidence, refinement types and contracts."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

# The authority provider: it wraps the ambient APIs that core crates may not
# call, so it is an edge crate itself.
[package.metadata.tauten]
tier = "edge"

[features]
default = ["std"]
# The ambient-authority wrappers (`Authority`, `SystemClock`, `Env`). Without
# it the crate is `no_std` + `alloc`, for kernel crates.
std = []
# Directory capabilities; bounded reads charge through the proved budget
# arithmetic in `tauten-check-kernel`.
fs = ["std", "dep:cap-std", "dep:tauten-check-kernel"]

[dependencies]
cap-std = { version = "4.0.3", optional = true }
tauten-check-kernel = { path = "../tauten-check-kernel", version = "0.2.0", optional = true }
tauten-macros = { path = "../tauten-macros", version = "0.2.0" }

[dev-dependencies]
trybuild = "1.0.125"
# Tests always see every capability, so compile-fail output is stable.
tauten = { path = ".", features = ["fs"] }

[package.metadata.docs.rs]
all-features = true
