# --------------------------------------------------------------- kernel ---

[[rule]]
id = "TAU-H001"
title = "Release builds check integer overflow"
lints = []
levels = { kernel = "deny", core = "deny", edge = "deny" }
enforced_by = "tauten"
why = "Integer overflow panics in debug builds but silently wraps in release builds unless `overflow-checks` is on. The arithmetic lints cover the source tauten scans; this setting covers everything compiled in the workspace, dependencies included. The decision is proved (tauten_check_kernel::manifest::hardening): a setting tauten cannot read is never clean. Limits: it covers binaries built from this workspace, not downstream users of a library crate (their own profile decides), and an environment override (`CARGO_PROFILE_RELEASE_OVERFLOW_CHECKS`) or a Cargo config outside the workspace (for example `~/.cargo/config.toml`) at build time is not seen."
fix = "Add `overflow-checks = true` under `[profile.release]` in the workspace Cargo.toml (`cargo tauten init --write` does), and remove any `[profile.release.package.<name>]` or `.cargo/config.toml` entry that sets it to false."
family = "safety"
invariant = "Release builds of the workspace check integer overflow."
sees = "manifest"
dominion = "Settings outside the workspace manifests (environment variables, Cargo configs outside the workspace). Downstream builds of a library crate."
complete = true
fixtures = ["fixtures/rej-overflow"]

[[rule]]
id = "TAU-K001"
in_tests = false
title = "Kernel determinism and purity"
lints = []
levels = { kernel = "deny" }
enforced_by = "clippy"
why = "Kernel decisions must be deterministic and free of shared mutable state so they can be extracted and proved (Aeneas) and replayed exactly."
fix = "Use `BTreeMap`/`BTreeSet` and plain owned values; pass state explicitly."
family = "obligation"
invariant = "No banned non-deterministic or impure API in kernel crates."
sees = "resolved"
dominion = "Code expanded from macros defined in other crates (clippy skips it); code disabled by `cfg`; build scripts. APIs not on the tier's ban list (clippy.toml), including dependency functions that wrap a banned one; foreign code."
complete = true
fixtures = ["rej-kernel-impure"]

[[rule]]
id = "TAU-K002"
in_tests = false
title = "Kernel uses core/alloc paths"
lints = ["clippy::std_instead_of_core", "clippy::std_instead_of_alloc"]
levels = { kernel = "deny" }
enforced_by = "clippy"
why = "Kernel crates are `no_std`; `std` paths hide the dependency."
fix = "Import from `core::` or `alloc::`."
family = "obligation"
invariant = "Kernel crates name `core`/`alloc` items through `core`/`alloc`."
sees = "resolved"
dominion = "Code expanded from macros defined in other crates (clippy skips it); code disabled by `cfg`; build scripts."
complete = true
fixtures = ["rej-kernel-std"]

[[rule]]
id = "TAU-K003"
title = "Kernel crate attributes"
lints = []
levels = { kernel = "deny" }
enforced_by = "tauten"
why = "A kernel crate root must declare `#![no_std]` so the compiler enforces the absence of IO."
fix = "Add `#![no_std]` (or `#![cfg_attr(not(test), no_std)]`) at the top of the kernel crate's `lib.rs`, with no other condition."
family = "obligation"
invariant = "A kernel library root declares `#![no_std]` unconditionally or as `#![cfg_attr(not(test), no_std)]`; any other condition, and a root that does not parse, is a finding."
sees = "source"
dominion = "Nothing: the crate root is read in full."
complete = true
fixtures = ["rej-kernel-impure", "rej-conditional-no-std"]

[[rule]]
id = "TAU-K004"
title = "Proved kernel code translates"
lints = []
levels = { kernel = "deny" }
enforced_by = "tauten"
why = "A kernel crate listed in `[gate] crates` of proofs/claims.toml is proved over its Charon/Aeneas translation, so it must stay inside what the pinned toolchain translates, without opaque library functions (axioms the proof audit refuses). No syntax rule can predict that exactly across toolchain releases, so the translation decides: `cargo tauten check --extract` (or `cargo tauten proofs extract`) runs it. When the toolchain is not available the check fails as tool-missing; it is never reported clean. The kernel section of the agent profile lists the known limits of the pinned toolchain."
fix = "Rewrite the code at the reported location inside the translatable subset (the agent profile's kernel section lists the known limits), then re-run `cargo tauten proofs extract --crate <dir>`."
family = "safety"
invariant = "The crates of `[gate] crates` translate with the pinned Charon/Aeneas, without opaque functions."
sees = "translation"
dominion = "Kernel crates not listed in `[gate] crates`."
complete = true
fixtures = ["fixtures/extract/rej-dyn", "fixtures/extract/rej-iterator"]

# ----------------------------------------------------------- structure ---

[[rule]]
id = "TAU-T001"
title = "Every workspace crate declares a tier"
lints = []
levels = { kernel = "deny", core = "deny", edge = "deny" }
enforced_by = "tauten"
why = "Rules depend on the tier; an undeclared crate would escape the profile."
fix = "Add `[package.metadata.tauten]` with `tier = \"kernel\"`, `\"core\"` or `\"edge\"` to the crate's Cargo.toml."
family = "obligation"
invariant = "Every workspace member declares a valid tier."
sees = "manifest"
dominion = "Nothing: `cargo metadata` lists every member."
complete = true
fixtures = ["rej-no-tier"]

[[rule]]
id = "TAU-T002"
title = "Tier dependency direction"
lints = []
levels = { kernel = "deny", core = "deny", edge = "deny" }
enforced_by = "tauten"
why = "Dependencies must point inward (edge -> core -> kernel); otherwise a pure crate can reach IO through its dependency."
fix = "Invert the dependency: move the shared code down a tier, or pass the capability in."
family = "obligation"
invariant = "Normal dependencies between members point inward (edge to core to kernel)."
sees = "manifest"
dominion = "Dev- and build-dependencies."
complete = true
fixtures = ["rej-kernel-up"]

[[rule]]
id = "TAU-T003"
title = "Kernel dependencies are allowlisted"
lints = []
levels = { kernel = "deny" }
enforced_by = "tauten"
why = "Each external dependency of the kernel widens what must be trusted and may block proof extraction."
fix = "Remove the dependency, or list it in `[package.metadata.tauten] kernel-deps = [\"name\"]` with a justification in review."
family = "obligation"
invariant = "A kernel crate depends only on allowlisted crates outside the workspace."
sees = "manifest"
dominion = "Dev- and build-dependencies."
complete = true
fixtures = ["rej-kernel-dep"]

[[rule]]
id = "TAU-D001"
in_tests = false
title = "Documented public API"
lints = ["missing_docs", "clippy::missing_errors_doc", "clippy::missing_panics_doc"]
levels = { kernel = "warn", core = "warn" }
enforced_by = "rustc"
why = "Undocumented public items and error cases are where callers, human or agent, guess wrong."
fix = "Add a doc comment; document each error variant a function can return under `# Errors`."
family = "style"
invariant = "Public items are documented, with `# Errors`/`# Panics` sections where they apply."
sees = "resolved"
dominion = "Code expanded from macros defined in other crates (clippy skips it); code disabled by `cfg`; build scripts."
complete = true
fixtures = []

# -------------------------------------------------------------- ratchet ---

[[rule]]
id = "TAU-R001"
title = "Baseline must be tight"
lints = []
levels = { kernel = "deny", core = "deny", edge = "deny" }
enforced_by = "tauten"
why = "The baseline records existing violations so a project can adopt the profile gradually. It may only shrink: once a violation is fixed, its slot must be removed, or a new violation could silently take it."
fix = "Run `cargo tauten baseline` and commit the smaller baseline file."
family = "obligation"
invariant = "The lint baseline accepts no more findings than exist."
sees = "record"
dominion = "The committed baseline itself (its diff is reviewed)."
complete = true
fixtures = ["crates/cargo-tauten/tests/ratchet.rs"]

[[rule]]
id = "TAU-R002"
title = "Recorded proof claims are not weakened"
lints = []
levels = { kernel = "deny", core = "deny", edge = "deny" }
enforced_by = "tauten"
why = "A proof claim is only as strong as its theorems and the mutants that show they bite, and as the assumptions it rests on. Deleting a mutant, dropping a theorem or adding an assumption makes a claim weaker while its badge still says proved. The committed proofs/claims.json is the record; proofs/claims.toml may not drop a recorded theorem or mutant, or add an assumption, unless an `[[amend]]` entry names the change and gives a reason. The decision is proved (tauten_check_kernel::registry::conserves); it is relative to the committed record, and reviewing that record's diff is trusted."
fix = "Restore the theorem, mutant or assumption, or add `[[amend]]` with `file`, `function`, `kind` (theorem, mutant or assumption), `name` and `reason` to proofs/claims.toml. After `cargo tauten proofs` re-records proofs/claims.json, remove the amendment."
family = "obligation"
invariant = "A recorded proof claim keeps its theorems and mutants and gains no assumption, unless amended with a reason."
sees = "record"
dominion = "The committed `proofs/claims.json` itself (its diff is reviewed)."
complete = true
fixtures = ["crates/cargo-tauten/tests/proofs.rs"]

