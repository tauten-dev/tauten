# The tauten profile: the single source of truth for lint levels, banned APIs,
# structural rules and the text `cargo tauten explain` prints.
#
# Tiers: kernel (pure, no_std, proof-eligible), core (no ambient authority),
# edge (startup/IO; may mint authority).
# Levels: "warn" | "deny". A tier missing from `levels` leaves the lint at its
# default. `cargo tauten check` compiles every profile lint at warn level (so
# one crate's violations never stop its dependents from being checked) and
# then reports each finding at the level given here. `deny` findings can be
# excused only by `#[expect(lint, reason = "...")]` (TAU-X001); rules with
# `exceptions = false`, and every profile lint in the kernel tier, admit no
# exception at all (TAU-X004). rustc's `forbid` is not used: derive macros
# commonly emit `#[allow(clippy::...)]`, which rustc rejects under forbid.
# `in_tests = false`: the rule is not applied when compiling test targets
# (`#[cfg(test)]` code and `tests/`); tests may panic, do arithmetic, touch
# temp files and print. Ignored results, stubs and exception hygiene still
# apply to tests.
# `enforced_by`: rustc | clippy | tauten | convention.

version = 1

# ---------------------------------------------------------------- panics ---

[[rule]]
id = "TAU-P001"
in_tests = false
title = "No unwrap/expect on fallible values"
lints = ["clippy::unwrap_used", "clippy::expect_used", "clippy::get_unwrap"]
levels = { kernel = "deny", core = "deny", edge = "deny" }
enforced_by = "clippy"
why = "unwrap/expect turn every unexpected input into a crash, and agents use them to silence the type checker instead of handling the case."
fix = "Propagate with `?` and a typed error, or handle the None/Err case explicitly with match, if let, or a default chosen on purpose."
family = "safety"
invariant = "No `unwrap`/`expect` call on a fallible value in linted code."
sees = "resolved"
dominion = "Code expanded from macros defined in other crates (clippy skips it); code disabled by `cfg`; build scripts."
complete = true
fixtures = ["rej-unwrap"]

[[rule]]
id = "TAU-P002"
in_tests = false
title = "No explicit panics"
lints = ["clippy::panic", "clippy::unreachable"]
levels = { kernel = "deny", core = "deny", edge = "warn" }
enforced_by = "clippy"
why = "A panic is an untyped, unrecoverable failure that callers cannot see in the signature."
fix = "Return a typed error variant. If the state is truly impossible, restructure the types so it cannot be represented."
family = "safety"
invariant = "No `panic!`/`unreachable!` in linted code."
sees = "resolved"
dominion = "Code expanded from macros defined in other crates (clippy skips it); code disabled by `cfg`; build scripts."
complete = true
fixtures = ["rej-panic"]

[[rule]]
id = "TAU-P003"
in_tests = false
title = "No panicking index or slice"
lints = ["clippy::indexing_slicing", "clippy::string_slice"]
levels = { kernel = "deny", core = "deny", edge = "warn" }
enforced_by = "clippy"
why = "`v[i]` and `&s[a..b]` panic on out-of-range or non-char-boundary input; off-by-one errors become crashes."
fix = "Use `.get(i)` / `.get(a..b)` and handle None, iterate instead of indexing, or use `split_at_checked`."
family = "safety"
invariant = "No panicking index or string slice in linted code."
sees = "resolved"
dominion = "Code expanded from macros defined in other crates (clippy skips it); code disabled by `cfg`; build scripts."
complete = true
fixtures = ["rej-index"]

[[rule]]
id = "TAU-P004"
in_tests = false
title = "No panics inside fallible functions"
lints = ["clippy::unwrap_in_result", "clippy::panic_in_result_fn"]
levels = { kernel = "deny", core = "deny", edge = "deny" }
enforced_by = "clippy"
why = "A function that returns Result has promised to report failure as a value; panicking inside it breaks that promise."
fix = "Map the failure into the function's error type and return it with `?`."
family = "safety"
invariant = "No panic or unwrap inside a function that returns `Result`."
sees = "resolved"
dominion = "Code expanded from macros defined in other crates (clippy skips it); code disabled by `cfg`; build scripts."
complete = true
fixtures = ["rej-panic-in-result"]

[[rule]]
id = "TAU-P005"
in_tests = false
title = "No process exit or leaked values outside the edge"
lints = ["clippy::exit", "clippy::mem_forget"]
levels = { kernel = "deny", core = "deny" }
enforced_by = "clippy"
why = "Exiting skips cleanup and hides control flow from callers; mem::forget silently leaks resources."
fix = "Return an error to the edge and let `main` decide the exit code; drop values normally."
family = "safety"
invariant = "No `process::exit` or `mem::forget` outside the edge."
sees = "resolved"
dominion = "Code expanded from macros defined in other crates (clippy skips it); code disabled by `cfg`; build scripts. APIs not on the tier's ban list (clippy.toml), including dependency functions that wrap a banned one; foreign code."
complete = true
fixtures = ["rej-exit"]

# ------------------------------------------------------------- numerics ---

[[rule]]
id = "TAU-N001"
in_tests = false
title = "Checked arithmetic"
lints = ["clippy::arithmetic_side_effects", "clippy::integer_division"]
levels = { kernel = "deny", core = "deny", edge = "warn" }
enforced_by = "clippy"
why = "Integer overflow and division by zero either panic or wrap silently depending on build profile; both are logic errors agents rarely test."
fix = "Use `checked_*` and return an error on None, or `saturating_*`/`wrapping_*` when that behaviour is the specification. Say which in a comment."
family = "safety"
invariant = "No arithmetic that can overflow, divide by zero or truncate silently in linted code."
sees = "resolved"
dominion = "Code expanded from macros defined in other crates (clippy skips it); code disabled by `cfg`; build scripts."
complete = true
fixtures = ["rej-contract-overflow"]

[[rule]]
id = "TAU-N002"
in_tests = false
title = "No lossy `as` casts"
lints = ["clippy::as_conversions", "clippy::cast_possible_truncation", "clippy::cast_sign_loss", "clippy::cast_possible_wrap"]
levels = { kernel = "deny", core = "deny", edge = "warn" }
enforced_by = "clippy"
why = "`as` silently truncates, wraps and changes sign."
fix = "Use `From`/`TryFrom` (`u32::try_from(x)?`) so out-of-range values become errors."
family = "safety"
invariant = "No `as` conversion that can lose information in linted code."
sees = "resolved"
dominion = "Code expanded from macros defined in other crates (clippy skips it); code disabled by `cfg`; build scripts."
complete = true
fixtures = ["rej-lossy-cast"]

[[rule]]
id = "TAU-N003"
in_tests = false
title = "No floating point in the kernel"
lints = ["clippy::float_arithmetic"]
levels = { kernel = "deny" }
enforced_by = "clippy"
why = "Floating point is not associative and has NaN; kernel decisions must be exact and proof-friendly."
fix = "Use integers in fixed units (cents, milliseconds, basis points) or a rational type."
family = "obligation"
invariant = "No floating-point arithmetic in kernel crates."
sees = "resolved"
dominion = "Code expanded from macros defined in other crates (clippy skips it); code disabled by `cfg`; build scripts."
complete = true
fixtures = ["rej-kernel-impure"]

[[rule]]
id = "TAU-N004"
in_tests = false
title = "No exact float comparison"
lints = ["clippy::float_cmp", "clippy::float_cmp_const"]
levels = { kernel = "deny", core = "deny", edge = "deny" }
enforced_by = "clippy"
why = "Exact equality of computed floats is almost always a bug."
fix = "Compare with an explicit tolerance, or use integers in fixed units."
family = "safety"
invariant = "No exact `==` comparison of floating-point values."
sees = "resolved"
dominion = "Code expanded from macros defined in other crates (clippy skips it); code disabled by `cfg`; build scripts."
complete = true
fixtures = ["rej-float-eq"]

# --------------------------------------------------------------- errors ---

[[rule]]
id = "TAU-E001"
title = "Never ignore a result"
lints = ["unused_must_use", "clippy::map_err_ignore"]
levels = { kernel = "deny", core = "deny", edge = "deny" }
enforced_by = "rustc"
why = "Dropping a Result or discarding the original error is how failures go silent."
fix = "Propagate with `?`, handle the error, or wrap it with context (`.map_err(|e| MyError::Io(e))`) instead of discarding it."
family = "safety"
invariant = "No `#[must_use]` value (a `Result`) dropped silently."
sees = "resolved"
dominion = "Code expanded from macros defined in other crates (clippy skips it); code disabled by `cfg`; build scripts."
complete = true
fixtures = ["rej-ignored-result"]

[[rule]]
id = "TAU-E003"
in_tests = false
title = "Explicit discards of results need a reason"
lints = ["clippy::let_underscore_must_use"]
levels = { kernel = "deny", core = "deny", edge = "deny" }
enforced_by = "clippy"
why = "`let _ = fallible()` is visible but still loses the failure. In library code that is rarely right; in tests it is the normal idiom for best-effort cleanup, so tests are exempt."
fix = "Handle or propagate the result. If discarding is correct, say why: `#[expect(clippy::let_underscore_must_use, reason = \"best-effort cleanup\")]`."
family = "safety"
invariant = "No `let _ =` discard of a `#[must_use]` value."
sees = "resolved"
dominion = "Code expanded from macros defined in other crates (clippy skips it); code disabled by `cfg`; build scripts."
complete = true
fixtures = ["rej-let-underscore"]

[[rule]]
id = "TAU-E002"
in_tests = false
title = "Typed errors outside the edge"
lints = ["clippy::result_unit_err"]
levels = { kernel = "deny", core = "deny" }
enforced_by = "clippy"
why = "`Result<T, ()>`, `anyhow::Error` and similar erase which failures are possible, so callers cannot handle them exhaustively."
fix = "Define an error enum (for example with `thiserror`) whose variants name each failure. Convert to anyhow/eyre only in edge crates."
family = "obligation"
invariant = "No `Result<_, ()>` error type outside the edge."
sees = "resolved"
dominion = "Code expanded from macros defined in other crates (clippy skips it); code disabled by `cfg`; build scripts."
complete = true
fixtures = ["rej-unit-error"]

# ---------------------------------------------------------------- match ---

[[rule]]
id = "TAU-M001"
in_tests = false
title = "No wildcard arms over enums you own"
lints = ["clippy::wildcard_enum_match_arm", "clippy::match_wildcard_for_single_variants"]
levels = { kernel = "deny", core = "deny", edge = "warn" }
enforced_by = "clippy"
why = "A `_` arm silently absorbs variants added later; exhaustive matches turn a new variant into a compile error at every decision site."
fix = "List every variant. Group them with `A | B => ...` if they share behaviour."
family = "obligation"
invariant = "No wildcard arm in a `match` over an enum of the workspace."
sees = "resolved"
dominion = "Code expanded from macros defined in other crates (clippy skips it); code disabled by `cfg`; build scripts."
complete = true
fixtures = ["rej-wildcard"]

# ---------------------------------------------------------------- stubs ---

[[rule]]
id = "TAU-S001"
title = "No stubs or debug leftovers"
exceptions = false
lints = ["clippy::todo", "clippy::unimplemented", "clippy::dbg_macro"]
levels = { kernel = "deny", core = "deny", edge = "deny" }
enforced_by = "clippy"
why = "Agents leave `todo!()` and `unimplemented!()` behind and report the task done."
fix = "Implement the branch, or return a typed `Unsupported` error if the case is deliberately out of scope."
family = "obligation"
invariant = "No `todo!`, `unimplemented!` or `dbg!` in linted code."
sees = "resolved"
dominion = "Code expanded from macros defined in other crates (clippy skips it); code disabled by `cfg`; build scripts."
complete = true
fixtures = ["rej-stub"]

[[rule]]
id = "TAU-S002"
title = "Suspicious placeholder comments"
lints = []
levels = { kernel = "warn", core = "warn", edge = "warn" }
enforced_by = "tauten"
why = "Comments such as 'for now', 'placeholder', 'TODO' or 'FIXME' usually mark unfinished work that tests do not cover."
fix = "Finish the work, or track it in your issue tracker and remove the comment."
family = "style"
invariant = "Comments that read like placeholders (\"for now\", \"TODO\") are flagged (a text heuristic)."
sees = "source"
dominion = "Attributes and items produced by macros; files outside a member's `src/`. Placeholder wording it has no pattern for."
complete = false
fixtures = ["rej-placeholder"]

# ---------------------------------------------------------- escape hatch ---

[[rule]]
id = "TAU-X001"
title = "Lint exceptions must be `#[expect]` with a reason"
lints = ["clippy::allow_attributes", "clippy::allow_attributes_without_reason", "unfulfilled_lint_expectations"]
levels = { kernel = "deny", core = "deny", edge = "deny" }
enforced_by = "clippy"
why = "`#[allow]` silently outlives the code it excused. `#[expect(lint, reason = \"...\")]` documents why and fails once the exception is no longer needed."
fix = "Replace `#[allow(x)]` with `#[expect(x, reason = \"why this is safe here\")]` on the smallest item possible, or fix the code."
family = "obligation"
invariant = "Every lint exception is `#[expect]` with a reason."
sees = "resolved"
dominion = "Code expanded from macros defined in other crates (clippy skips it). Inner attributes and `allow` inside `cfg_attr` are read by tauten itself, in `src/`, `tests/`, `benches/`, `examples/` and the build script."
complete = true
fixtures = ["rej-allow", "rej-file-allow", "rej-cfg-attr-allow"]

[[rule]]
id = "TAU-X002"
title = "No crate-wide exceptions to profile lints"
lints = []
levels = { kernel = "deny", core = "deny", edge = "deny" }
enforced_by = "tauten"
why = "A crate-level `#![expect(...)]` or `#![allow(...)]` of a profile lint switches the rule off for the whole crate."
fix = "Move the exception to the single item that needs it, with a reason."
family = "obligation"
invariant = "No crate-level `#![allow]`/`#![expect]` of a profile lint."
sees = "source"
dominion = "Attributes and items produced by macros. Read in `src/`, `tests/`, `benches/`, `examples/` and the build script, including inside `cfg_attr`; a lint group counts as every profile rule it may contain (an over-approximation)."
complete = true
fixtures = ["rej-crate-wide"]

[[rule]]
id = "TAU-X003"
title = "Manifest lint table loosens the profile"
lints = []
levels = { kernel = "warn", core = "warn", edge = "warn" }
enforced_by = "tauten"
why = "`[lints]` entries that allow or warn profile lints have no effect under `cargo tauten check` but mislead readers and plain `cargo clippy` runs."
fix = "Remove the entry from `[lints]` / `[workspace.lints]`."
family = "obligation"
invariant = "No `[lints]` entry that lowers a lint the profile keeps blocking."
sees = "manifest"
dominion = "Settings outside the workspace manifests (environment variables, Cargo configs outside the workspace)."
complete = true
fixtures = []

[[rule]]
id = "TAU-X004"
title = "No exceptions to this rule here"
lints = []
levels = { kernel = "deny", core = "deny", edge = "deny" }
enforced_by = "tauten"
why = "Some rules admit no exceptions: stub macros anywhere, and any profile lint in a kernel crate, whose code must stay extractable and provable."
fix = "Remove the `#[expect]`/`#[allow]` and fix the code it excused."
family = "obligation"
invariant = "No exception of a rule that admits none (any rule, in kernel crates), and no conditional (`cfg_attr`) exception in kernel crates."
sees = "source"
dominion = "Attributes and items produced by macros. Read in `src/`, `tests/`, `benches/`, `examples/` and the build script, including inside `cfg_attr`; a lint group counts as every profile rule it may contain (an over-approximation)."
complete = true
fixtures = ["rej-kernel-exception", "rej-stub-excused", "rej-group-allow", "rej-test-exception"]

