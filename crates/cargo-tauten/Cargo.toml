[package]
name = "cargo-tauten"
description = "Run the tauten strictness profile over a Cargo workspace."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[package.metadata.tauten]
tier = "edge"

[dependencies]
anyhow = "1.0.104"
cargo_metadata = "0.23.1"
clap = { version = "4.6.8", features = ["derive"] }
serde_json = "1.0.154"
tauten-check.workspace = true
toml = "1.2.1"
toml_edit = "0.25.20"
